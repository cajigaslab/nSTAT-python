version: 1
extras:
  - demo_id: continuous_cif
    name: continuous_cif_demo
    script: examples/extras/continuous_cif_demo.py
    title: Continuous-time CIF simulator — filtered stimulus drive + inhibitory self-history
    question: Does a continuous LTI stimulus filter integrated with scipy.signal.lsim reproduce closed-form linear-systems-theory filtering, and does a nonzero continuous self-history feedback filter measurably regularize spiking relative to no history?
    description: |
      Native-Python port of the MATLAB Simulink model
      ``PointProcessSimulationCont.slx``
      (:func:`nstat.extras.continuous_cif.simulate_cif_continuous`). A
      slow 1 Hz "LFP" stimulus is filtered through a continuous
      first-order lowpass ``S(s)`` before driving a simulated unit's
      firing probability, while an inhibitory continuous self-history
      filter ``H(s)`` models post-spike refractoriness. Compares the
      numerically realised filtered drive against the closed-form
      steady-state sinusoidal response (ground truth vs. recovered),
      and contrasts spike rasters / ISI coefficient-of-variation with
      vs. without the continuous self-history feedback (same injected
      uniform draws in both runs).
    figures:
      - filename: fig01_continuous_stim_filter_and_history.png

  - demo_id: decoding_clusterless
    name: decoding_clusterless_demo
    script: examples/extras/decoding_clusterless_demo.py
    title: Clusterless decoding vs. a sorted decoder as spike sorting degrades
    question: Can we decode kinematics/position from unsorted multiunit events + waveform marks, and does clusterless decoding match/beat sorted decoding as sorting quality degrades?
    description: |
      Four place-/kinematic-tuned units emit unsorted multiunit events with
      overlapping tetrode-mark clusters on a 1-D back-and-forth trajectory.
      ``fit_clusterless_decoder`` decodes directly from the never-sorted
      marks (Denovellis 2021, eLife), while a ``SortedSpikesDecoder``
      comparator decodes from spike trains whose unit labels are corrupted
      at a tunable sort-error rate -- the clusterless decoder degrades
      gracefully while the sorted decoder collapses at high sort-error
      rates.  Also runs the discrete-state ``fit_clusterless_classifier``.
    figures:
      - filename: fig01_trajectory_posteriors.png
      - filename: fig02_decode_error_vs_sort_rate.png

  - demo_id: decoding_place_field
    name: decoding_place_field_demo
    script: examples/extras/decoding_place_field_demo.py
    title: Population-vector bias vs. maximum-likelihood decode of reach direction
    question: Is the classic population vector (Georgopoulos et al. 1982/1986) biased when M1 preferred directions are non-uniformly distributed, and does a maximum-likelihood/Bayesian tuning-curve decode (Sanger 1996) stay unbiased where the population vector fails?
    description: |
      An 80-unit M1 population on an 8-direction center-out task, with
      preferred directions deliberately clustered (Sanger 1996's
      nonuniform-PD scenario) rather than uniform. Per-neuron cosine/
      von-Mises tuning curves are fit with ``nstat.fit_poisson_glm``,
      then held-out trials are decoded with the classic population
      vector and with a maximum-likelihood grid search over the fitted
      tuning curves. The population vector is systematically biased
      toward the dense preferred-direction region; the ML decoder is
      not.
    figures:
      - filename: fig01_pv_vs_ml_decode.png
      - filename: fig02_tuning_curves.png

  - demo_id: em_dynamax
    name: em_dynamax_demo
    script: examples/extras/em_dynamax_demo.py
    title: Motor-BCI decoder calibration — naive-KF vs. ReFIT-KF recalibration
    question: How should a decoder be calibrated from neural + behavioral training data, and does closed-loop-aware (ReFIT) recalibration correct a systematic directional bias baked into an open-loop-calibrated decoder's training label, relative to a naively calibrated Kalman decoder?
    description: |
      A Wu (2006)-style linear-Gaussian arm state (position/velocity)
      coupled to a 40-unit population with linear velocity encoding
      drives an 8-target center-out reach+hold task. A naive-KF decoder,
      calibrated from a constant-velocity, never-decelerating training
      label (a stand-in for open-loop/passive calibration blocks), is
      contrasted against a ReFIT-KF decoder (Gilja et al. 2012)
      recalibrated by relabeling the same recorded neural data with the
      true target-directed, decelerating kinematics. Both share the same
      generic Kalman motion model and are decoded with
      ``nstat.decoding_algorithms.DecodingAlgorithms.kalman_filter`` — a
      pure NumPy/SciPy contrast that always runs. Also exercises every
      routine in ``nstat.extras.em.dynamax_bridge`` — linear-Gaussian EM,
      point-process filter/smoother (Eden et al. 2004), point-process EM,
      hybrid Poisson+Gaussian EM, and a pure-NumPy held-out predictive
      log-likelihood — as an opt-in appendix, closing the
      AUDIT_REPORT.md §3.2 gap (19 unported MATLAB methods).
    figures:
      - filename: fig01_bci_reach_trajectories.png
      - filename: fig02_acquisition_metrics.png

  - demo_id: interop_neo
    name: interop_neo_demo
    script: examples/extras/interop_neo_demo.py
    title: Vendor-agnostic ingestion for a multi-site iBCI trial via Neo
    question: Can a ``nspikeTrain`` from any recording vendor (Blackrock, Plexon, TDT) round-trip through ``neo.core.SpikeTrain`` — the common object model Garcia et al. (2014) designed for exactly this heterogeneity — preserving spike times, recording window, and name, and be packaged as a ``neo.core.Segment`` for Elephant / SpikeInterface?
    description: |
      Demonstrates :mod:`nstat.extras.interop.neo` as one ingestion path
      that serves every site of a multi-site iBCI trial regardless of
      recording hardware: converts an :class:`nstat.nspikeTrain` to
      :class:`neo.core.SpikeTrain`, round-trips back, and builds a
      :class:`neo.core.Segment` from a :class:`SpikeTrainCollection` for
      downstream consumption. Reference: Garcia et al. (2014), Front
      Neuroinform 8:10.
    figures: []

  - demo_id: interop_pynapple
    name: interop_pynapple_demo
    script: examples/extras/interop_pynapple_demo.py
    title: Bug-resistant clinical epoch bookkeeping -- nstat ↔ pynapple round-trip via IntervalSet
    question: Does the pynapple bridge round-trip a ``nspikeTrain`` through ``pynapple.Ts`` and preserve the recording window when ``IntervalSet.restrict`` -- the epoch algebra Viejo et al. (2023) built for exactly this bookkeeping -- carves out a clinically-meaningful sub-epoch, such as an interictal-only iEEG window or a single BCI-trial window?
    description: |
      Demonstrates :mod:`nstat.extras.interop.pynapple`: converts to
      :class:`pynapple.Ts` with the recording-window
      :class:`pynapple.IntervalSet`, restricts to a sub-epoch --
      standing in for an interictal-only window in an iEEG recording,
      or a single BCI-trial window -- using pynapple's
      ``IntervalSet.restrict`` epoch math instead of hand-rolled index
      arithmetic, and converts back with the sub-epoch as support.
      Reference: Viejo et al. (2023), eLife 12:e85786.
    figures: []

  - demo_id: interop_nwb
    name: interop_nwb_demo
    script: examples/extras/interop_nwb_demo.py
    title: Read an NWB file into a ``SpikeTrainCollection`` -- the units/obs_intervals path, motivated by AJILE12's DANDI clinical iEEG data
    question: Does the NWB bridge resolve per-unit observation windows from ``obs_intervals`` -- the ``units`` table shape used by spike-sorted (single/multi-unit) NWB datasets -- and honour an explicit ``time_window=`` override, the general ingestion pattern that also matters for clinical human-iEEG NWB/DANDI datasets such as AJILE12 (Peterson et al. 2022)?
    description: |
      Builds a synthetic in-memory NWB file (so the demo runs without any
      download or new dependency) with a ``units``/``obs_intervals``
      table -- the shape used by spike-sorted (single/multi-unit) NWB
      datasets -- and converts it to nstat primitives using both the
      ``obs_intervals`` resolution path and the explicit
      ``time_window=(t0, t1)`` override that silences the fallback
      warning. AJILE12 (Peterson et al. 2022, Sci Data 9:184; DANDI
      dandiset 000055) -- a real chronic-ECoG-plus-pose human-iEEG
      dataset on DANDI, stored in NWB -- motivates why a robust NWB
      reader matters for clinical/BCI data, though AJILE12 itself stores
      continuous ECoG voltage as an ``ElectricalSeries``, not a units
      table. References: Teeters et al. (2015), Neuron 88:629; Rübel
      et al. (2022), eLife 11:e78362; Peterson et al. (2022), Sci Data
      9:184 (DANDI dandiset 000055).
    figures: []

  - demo_id: latents_gpfa
    name: latents_gpfa_demo
    script: examples/extras/latents_gpfa_demo.py
    title: Single-trial rotational motor-cortical manifold recovery via GPFA (Yu et al. 2009; Churchland et al. 2012)
    question: Do motor populations occupy a low-dimensional rotational neural manifold -- a single shared rotational dynamical system, condition-invariant in frequency -- recoverable on single trials by GPFA, and does reconstruction fidelity improve with population size?
    description: |
      A 2-D skew-symmetric rotation generator drives six reach
      conditions' latent trajectories (shared angular frequency, distinct
      per-condition initial amplitude/phase -- the rotational-dynamics
      signature of Churchland et al. 2012), projected through a fixed
      random loading matrix into an 80-unit Poisson population with
      condition-locked baseline-rate offsets. GPFA (``x_dim=2``, via
      :mod:`nstat.extras.latents.gpfa_bridge`) is fit across all
      trials/conditions pooled; each recovered single-trial trajectory is
      realigned onto the true phase plane and scored with the multiple
      correlation coefficient. A population-size sweep (8/20/40/80
      neurons) shows reconstruction fidelity improving with population
      size, echoing Gallego et al. 2018/2020's manifold-stability results.
    figures:
      - filename: fig01_latent_trajectories.png

  - demo_id: metrics_spike_distances
    name: metrics_spike_distances_demo
    script: examples/extras/metrics_spike_distances_demo.py
    title: Pathological beta-burst synchrony in Parkinson's disease -- OFF vs. adaptive DBS
    question: Can time-resolved SPIKE-distance / SPIKE-synchronization / ISI-distance metrics track the emergence and collapse of pathological beta-burst synchrony across an STN population as it toggles between a Parkinsonian-OFF regime (long beta bursts, tight coincident firing) and an adaptive-DBS regime (truncated bursts, units returning toward independent firing)?
    description: |
      Simulates an 8-unit STN population driven by a shared, time-varying
      15-30 Hz beta-burst envelope that alternates between a synchronized
      "Parkinsonian OFF" regime (long bursts pulling units into tight
      coincident firing; Tinkhauser et al. 2017) and a desynchronized
      "adaptive-DBS" regime (truncated bursts, units returning toward
      independent firing).  Sliding-window ISI-distance / SPIKE-distance /
      SPIKE-synchronization (Kreuz et al. 2011/2012; Satuvuori et al. 2017)
      track the injected ground-truth synchrony envelope, and a summary
      compares synchrony-burst-duration distributions between the two
      regimes -- the same population-level beta-synchrony biomarker
      (Kuhn et al. 2009) that motivates closed-loop adaptive DBS.
    figures:
      - filename: fig01_beta_burst_synchrony.png

  - demo_id: modulated_renewal_microelectrode
    name: modulated_renewal_microelectrode_demo
    script: examples/extras/modulated_renewal_microelectrode_demo.py
    title: STN/GPi firing-phenotype recovery along one DBS microelectrode (MER) pass
    question: Can a gamma modulated-renewal CIF recover, from spikes alone, the three firing phenotypes (tonic-regular / tremor-locked bursting / irregular-high-entropy) neurosurgeons use to confirm MER targeting of the STN/GPi during DBS surgery?
    description: |
      Simulates three synthetic single units along one MER pass -- a
      tonic-regular high-shape gamma renewal unit, a tremor-locked
      bursting unit (baseline rate modulated at 4-6 Hz), and an
      irregular/high-entropy (shape~=1, Poisson) unit -- and fits each
      independently with :func:`nstat.extras.spatial.fit_modulated_renewal`.
      Recovers rate, renewal-CV regularity, a raw-ISI burst index, and
      rescaled-ISI KS goodness-of-fit
      (:func:`nstat.extras.spatial.renewal_cdf`,
      :mod:`nstat.extras.spatial.marked_gof`) per phenotype, reproducing
      the three-way phenotype separation clinicians read off MER traces.
    figures:
      - filename: fig01_raster_rate.png
      - filename: fig02_isi_vs_renewal.png
      - filename: fig03_ks_rescaled.png

  - demo_id: spatial_cluster_cox
    name: spatial_cluster_cox_demo
    script: examples/extras/spatial_cluster_cox_demo.py
    title: Hidden epileptogenic hubs — Thomas / Matérn-cluster recovery via minimum-contrast estimation
    question: Are clinically "silent" microdischarges organised around a few hidden epileptogenic hub sites, or randomly scattered — and can minimum-contrast estimation recover the hub count and dispersion from the offspring pattern alone?
    description: |
      Simulates a Thomas process — ``kappa`` latent, never-observed
      epileptogenic hub sites, each seeding several Gaussian-dispersed
      microdischarge offspring (sub-mm scale, per Stead 2010) — and a
      Matérn-cluster process repeating the same hidden-hub question with
      an alternative uniform-disc offspring geometry.  Recovers
      ``(sigma, lambda_p)`` and ``(R, lambda_p)`` — i.e. the dispersion
      and hub intensity ``kappa`` — from the offspring locations alone via
      the SOIRS-pair-correlation minimum-contrast estimator in
      :mod:`nstat.extras.spatial`.
    figures:
      - filename: fig01_thomas_scatter.png
      - filename: fig02_thomas_pcf.png
      - filename: fig03_matern_scatter.png
      - filename: fig04_matern_pcf.png

  - demo_id: spatial_gibbs
    name: spatial_gibbs_demo
    script: examples/extras/spatial_gibbs_demo.py
    title: Co-active/implanted-site spacing -- CSR vs. minimum-distance exclusion (hard-core) via Berman-Turner pseudo-likelihood
    question: When is co-active-site / implanted-electrode-contact spacing governed by a minimum-distance repulsion (hard-core exclusion) rather than independent placement (CSR) -- and can the Berman-Turner pseudo-likelihood recover the exclusion distance and confirm gamma ~= 1 (no interaction) for CSR?
    description: |
      Simulates CSR (independent placement) and a hard-core process
      enforcing a minimum inter-site distance ``R = 0.04`` (~4 mm on a
      10 cm x 10 cm cortical/subdural patch -- inside the range of SEEG
      trajectory-planning safety margins and optimal electrode-spacing
      analyses) at the same target intensity, then recovers the
      exclusion distance directly from the hard-core pattern's minimum
      inter-point distance and confirms ``gamma_hat ~= 1`` for CSR via
      :func:`nstat.extras.spatial.pseudo_likelihood_fit`. Strauss (mild
      inhibition) and area-interaction (clustering) processes are kept
      as secondary, purely contrastive panels.
    figures:
      - filename: fig01_strauss_scatter.png
      - filename: fig02_hardcore_scatter.png
      - filename: fig03_area_interaction_scatter.png

  - demo_id: spatial_gof_ecog
    name: spatial_gof_ecog_demo
    script: examples/extras/spatial_gof_ecog_demo.py
    title: Traveling-wave vs static-hot-spot GOF via space-time K/PCF + global-rank envelope on an ECoG grid
    question: Is ictal propagation a genuine traveling wave, or a static hot-spot consistent with an inhomogeneous-Poisson (independent-site) null -- and does the space-time global-rank envelope test correctly separate the two from the same held-out background?
    description: |
      Simulates a static-hot-spot (inhomogeneous-Poisson, temporally static
      rate bump) epoch and a traveling-wave (migrating Gaussian intensity
      bump, drawn by thinning) epoch on a synthetic 8x8 ECoG grid, fits a
      held-out :func:`nstat.extras.spatial.intensity_st_kde` from a
      separate calibration epoch, then tests both epochs with
      :func:`nstat.extras.spatial.k_st_inhom`,
      :func:`nstat.extras.spatial.pair_correlation_st`, and
      :func:`nstat.extras.spatial.global_envelope_st` against the
      inhomogeneous space-time Poisson null -- the envelope rejects the
      null only for the traveling wave, where a naive per-electrode rate
      map cannot separate the two scenarios.
    figures:
      - filename: fig01_kst_envelope.png
      - filename: fig02_pcf_g.png
      - filename: fig03_verdict.png

  - demo_id: spatial_hawkes_ecog
    name: spatial_hawkes_ecog_demo
    script: examples/extras/spatial_hawkes_ecog_demo.py
    title: Seizure core/penumbra decomposition via space-time Hawkes + Cox-Hawkes on an ECoG grid
    question: How much seizure activity is tonic background (a hyperexcitable seizure-onset zone, the clinical "penumbra") vs. self-excited recruitment (the actively-recruited ictal "core")? Do branching EM (homogeneous background) and the Cox-Hawkes alternating estimator (inhomogeneous LGCP background) recover the true recruitment kernel and separate core from penumbra activity on synthetic ECoG catalogues?
    description: |
      Simulates a homogeneous-background catalogue with
      :func:`nstat.extras.spatial.simulate_spatial_hawkes` and
      recovers ``(mu, K_branch, c, sigma_space)`` -- the self-exciting
      recruitment (core) kernel plus per-event core/penumbra declustering
      -- with :func:`nstat.extras.spatial.em_spatial_hawkes`, then
      simulates a second catalogue with an inhomogeneous LGCP
      background anchored at a fixed hyperexcitable seizure-onset zone
      via :func:`nstat.extras.spatial.simulate_cox_hawkes` and recovers
      the core/penumbra (excitation/background) decomposition with
      :func:`nstat.extras.spatial.fit_cox_hawkes` on a synthetic 8x8 ECoG
      grid. Both catalogues recover the same within-recording
      core/penumbra split; they differ only in the background model.
      Presents Cox-Hawkes applied to the epilepsy core/penumbra
      decomposition as a methodological opportunity not yet explored in
      the epilepsy literature.
    figures:
      - filename: fig01_propagation_scatter.png
      - filename: fig02_recovered_kernels.png
      - filename: fig03_background_excitation_decomposition.png

  - demo_id: spatial_stlgcp_microelectrode
    name: spatial_stlgcp_microelectrode_demo
    script: examples/extras/spatial_stlgcp_microelectrode_demo.py
    title: Tracking a spreading-depolarisation / seizure wavefront with space-time KDE + Kronecker-Laplace LGCP
    question: Can the space-time kernel intensity estimate and the spatiotemporal LGCP posterior mean (with credible bands) recover a spreading-depolarisation / seizure wavefront's trajectory and propagation speed on a Utah-style microelectrode array, without fitting a parametric wave model?
    description: |
      Simulates a Gaussian population-rate wavefront translating across a
      10x10 Utah-style microelectrode array at a realistic ictal-wavefront
      speed over a short recording epoch, then fits
      :func:`nstat.extras.spatial.intensity_st_kde` and
      :func:`nstat.extras.spatial.lgcp_st_fit` and compares the true,
      KDE-estimated, and LGCP-estimated wavefront centroid (with credible
      bands from :meth:`nstat.extras.spatial.LGCPSTResult.rate_map`) at
      several time slices, plus a recovered-vs-true propagation-speed
      readout from a line fit through the recovered peak trajectory.
    figures:
      - filename: fig01_array_scatter.png
      - filename: fig02_kde_snapshots.png
      - filename: fig03_lgcp_snapshots.png

  - demo_id: validation_nemos
    name: validation_nemos_demo
    script: examples/extras/validation_nemos_demo.py
    title: Reviewer-grade cross-check of a reach-tuned encoding GLM -- nstat vs. NeMoS
    question: Does refitting the identical design matrix of a reach-tuned motor-cortex encoding GLM -- an instance of the point-process Poisson-GLM encoding family (Weber & Pillow 2017 show GLMs of this form reproduce diverse single-neuron response dynamics) -- in a second, independently-maintained implementation -- ``nemos.glm.GLM`` -- recover the same coefficients as ``nstat.fit_poisson_glm``, the reviewer-grade rigor check a clinical encoding-model paper's tuning claims would need?
    description: |
      Generates a synthetic Poisson spike-count fixture with known
      coefficients -- standing in for a reach-tuned unit's encoding
      coefficients driven by reach-kinematic covariates -- fits the same
      GLM with :func:`nstat.fit_poisson_glm` and NeMoS's
      (Flatiron Institute Center for Computational Neuroscience)
      :class:`nemos.glm.GLM`, and exercises
      :meth:`GLMComparison.assert_agree` — the regression-guard hook for
      parity tests. Reference: Weber & Pillow (2017), Neural Comput
      29:3260-3289 (arXiv:1602.07389).
    figures: []

  - demo_id: validation_pykalman
    name: validation_pykalman_demo
    script: examples/extras/validation_pykalman_demo.py
    title: Clinical velocity Kalman decoder — pykalman cross-check + chronic-drift recalibration
    question: Does the clinical workhorse velocity Kalman decoder (Wu 2006; Malik et al. 2011) replicate across independent implementations, and how does its decode accuracy degrade under chronic per-unit drift (Perge et al. 2013) and unit turnover (Downey et al. 2018) — and is periodic recalibration what restores it?
    description: |
      A synthetic M1 velocity-encoding population drives a 2-state
      ``(v_x, v_y)`` linear-Gaussian fixture; nstat's
      ``DecodingAlgorithms.kalman_filter``/``kalman_smoother`` and
      ``pykalman.KalmanFilter`` filter/smooth the same activity, and
      :meth:`KalmanComparison.assert_filtered_agree` is the regression-guard
      hook (gracefully skipped, not a failure, when the optional
      ``pykalman`` dependency is absent). A separate, pure NumPy/SciPy
      chronic-drift panel (always runs, no optional dependency) then
      decodes a larger M1 population across 15 simulated recording days
      under Perge-et-al.-2013-style per-unit gain/baseline random-walk
      drift and Downey-et-al.-2018-style unit turnover: a decoder frozen
      at its Day-0 calibration shows decode accuracy decay, while one
      periodically recalibrated from a short same-day calibration block
      holds accuracy near Day-0 levels throughout.
    figures:
      - filename: fig01_chronic_drift.png

  - demo_id: validation_statsmodels
    name: validation_statsmodels_demo
    script: examples/extras/validation_statsmodels_demo.py
    title: Regression guard for a clinical spike-encoding GLM -- nstat vs. statsmodels
    question: Does refitting the identical spike-encoding design matrix with statsmodels (Seabold & Perktold 2010) -- an independent, general-purpose reference implementation that, like nstat, fits the Poisson GLM by IRLS -- recover the same coefficients, catching any silent regression in nstat's own IRLS path?
    description: |
      Both nstat and statsmodels run IRLS (unlike NeMoS's optax-driven
      first-order optimizer), so the recovered coefficients should agree
      to near machine precision (~1e-9 on the synthetic spike-encoding
      fixture). This is the tightest cross-validation oracle in
      :mod:`nstat.extras.validation`, and the regression guard best
      suited to catching a silent break in nstat's own IRLS path.
      Reference: Seabold & Perktold (2010), Proc. 9th Python in Science
      Conf. (SciPy 2010), pp. 92-96 -- the statsmodels software paper,
      cited here for statsmodels as the independent reference GLM
      implementation, not as a neuroscience source.
    figures: []
